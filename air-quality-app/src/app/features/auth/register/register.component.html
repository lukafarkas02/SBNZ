<div class="auth-container">
  <div class="auth-card">

    <div class="auth-icon">
      <span>+</span>
    </div>

    <h2>Create Account</h2>
    <p class="subtitle">Register to access the system</p>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

      <div class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <input
            type="text"
            formControlName="firstName"
            placeholder="John"
          />
        </div>

        <div class="form-group">
          <label>Last Name</label>
          <input
            type="text"
            formControlName="lastName"
            placeholder="Doe"
          />
        </div>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          formControlName="email"
          placeholder="name@example.com"
        />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Password</label>
          <input
            type="password"
            formControlName="password"
            placeholder="••••••••"
          />
        </div>

        <div class="form-group">
          <label>Confirm Password</label>
          <input
            type="password"
            formControlName="confirmPassword"
            placeholder="••••••••"
          />
        </div>
      </div>

      <div class="form-group">
        <label>User type</label>
        <select formControlName="userType">
          <option value="">Choose type</option>
          <option value="citizen">Citizen</option>
          <option value="risk_group">Risk group</option>
          <option value="admin">Admin</option>
        </select>
      </div>

      <div
        class="conditional-block"
        *ngIf="registerForm.get('userType')?.value === 'risk_group'"
      >
        <div class="form-group">
          <label>Type of risk group</label>
          <select formControlName="riskType">
            <option value="">Choose group</option>
            <option value="child">Child</option>
            <option value="elderly">Elderly</option>
            <option value="chronical">Chronical</option>
            <option value="pregnant">Pregnant</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>City</label>
        <input
          type="text"
          formControlName="location"
          placeholder="City"
        />
      </div>

      <button type="submit" [disabled]="registerForm.invalid">
        Register
      </button>

    </form>

    <p class="auth-link">
      Already have an account?
      <a routerLink="/login">Sign in</a>
    </p>

  </div>
</div>
